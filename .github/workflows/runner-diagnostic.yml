name: Observe isolated runner assignment

# Private review candidate. The diagnostic runner must reject before any step.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: isolated-runner-diagnostic
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'sennett-lau/re-gvs-fvzdx' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'sennett-lau' &&
      github.triggering_actor == 'sennett-lau'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - isolated-diagnostic-v1
      - repo-re-gvs-fvzdx
      - "ri-diag-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-job-observe"
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Unexpected execution sentinel
        shell: bash
        run: |
          printf '%s\n' 'UNEXPECTED_DIAGNOSTIC_STEP_EXECUTION'
          exit 97
